services:
  api:
    depends_on:
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
      clamav:
        condition: service_started

  redis:
    image: ${RHUMI_REDIS_IMAGE:?Defina RHUMI_REDIS_IMAGE}
    restart: unless-stopped
    env_file:
      - ${RHUMI_CONFIG_ROOT:-/etc/rhumi}/staging.dependencies.env
    command:
      - sh
      - -ec
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  mailpit:
    image: ${RHUMI_MAILPIT_IMAGE:?Defina RHUMI_MAILPIT_IMAGE}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  clamav:
    image: ${RHUMI_CLAMAV_IMAGE:?Defina RHUMI_CLAMAV_IMAGE}
    restart: unless-stopped
    volumes:
      - clamav-signatures:/var/lib/clamav
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  prometheus:
    image: ${RHUMI_PROMETHEUS_IMAGE:?Defina RHUMI_PROMETHEUS_IMAGE}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ../ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../ops/prometheus-alerts.yml:/etc/prometheus/prometheus-alerts.yml:ro
      - ${RHUMI_CONFIG_ROOT:-/etc/rhumi}/metrics.token:/run/secrets/metrics_token:ro
      - prometheus-data:/prometheus
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  redis-data:
  clamav-signatures:
  prometheus-data:
